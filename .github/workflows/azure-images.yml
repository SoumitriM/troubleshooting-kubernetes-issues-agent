name: Build Azure images

# Builds the images that deploy/azure/deploy.sh runs on Azure Container Apps and
# publishes them to GitHub Container Registry (free for public repositories).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "frontend/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "deploy/azure/**"
      - ".github/workflows/azure-images.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: azure-images
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The docs index is generated, not committed. Rebuild it from the
      # official Kubernetes docs; indexing is incremental, so a cached index
      # only re-embeds pages that changed.
      - uses: actions/cache@v4
        with:
          path: data/kubernetes_docs.sqlite
          key: docs-index-${{ hashFiles('src/app/documentation/**') }}-${{ github.run_id }}
          restore-keys: docs-index-${{ hashFiles('src/app/documentation/**') }}-

      - name: Build documentation index
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install .
          python -m app.documentation.cli fetch
          python -m app.documentation.cli index
          ls -lh data/kubernetes_docs.sqlite

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase registry path
        run: echo "REGISTRY=${REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Build base API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/kubesage-api-base:${{ github.sha }}
          cache-from: type=gha,scope=api-base
          cache-to: type=gha,mode=max,scope=api-base

      - name: Build Azure API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/azure/api.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: BASE_IMAGE=${{ env.REGISTRY }}/kubesage-api-base:${{ github.sha }}
          build-contexts: docs=./data
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/kubesage-api:latest
            ${{ env.REGISTRY }}/kubesage-api:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          # The API's app name inside the Container Apps environment.
          build-args: API_UPSTREAM=http://kubesage-api
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/kubesage-frontend:latest
            ${{ env.REGISTRY }}/kubesage-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
