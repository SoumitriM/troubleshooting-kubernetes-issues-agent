[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-resolution-ai"
version = "0.1.0"
description = "AI-assisted incident-resolution platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiosqlite>=0.20,<1.0",
    "anthropic>=2.4,<3.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "langgraph>=0.2,<2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "neo4j>=5.0,<6.0",
    "numpy>=1.26,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "sentence-transformers>=3.0,<6.0",
    "snowballstemmer>=2.2,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
