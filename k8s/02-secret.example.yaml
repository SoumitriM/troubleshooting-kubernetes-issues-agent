  name: incident-ai-secrets
  namespace: incident-ai
type: Opaque
stringData:
  ANTHROPIC_API_KEY: replace-with-anthropic-api-key
  NEO4J_USERNAME: replace-with-neo4j-username
  NEO4J_PASSWORD: replace-with-neo4j-password
