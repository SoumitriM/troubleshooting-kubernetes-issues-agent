apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-ai-config
  namespace: incident-ai
data:
  APP_ENV: production
  NEO4J_URI: neo4j://neo4j:7687
  FH_GENIE_BASE_URL: https://replace-with-fh-genie-base-url.example
  FH_GENIE_MODEL: replace-with-fh-genie-model
  AGENT_RELEVANCE_THRESHOLD: "0.55"
  AGENT_ACTIONABLE_FIX_THRESHOLD: "0.65"
  RETRIEVAL_MIN_VECTOR_SCORE: "0.55"
  RETRIEVAL_EXCEPTIONAL_VECTOR_SCORE: "0.90"
  RETRIEVAL_MIN_FINAL_RELEVANCE_SCORE: "0.55"
  RETRIEVAL_MIN_RELATIVE_SCORE_RATIO: "0.85"
